name: Validate

on:
  pull_request:
  push:
    branches:
      - main
      - docs/life-domain-map

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Compile Python
        run: python -m py_compile tools/validate_repo.py tests/test_validate_repo.py
      - name: Run unit tests with stock Python
        run: python -m unittest discover -s tests
      - name: Validate repository with stock Python
        run: python tools/validate_repo.py
      - name: Install optional schema validator
        run: python -m pip install --disable-pip-version-check jsonschema==4.26.0
      - name: Run unit tests with jsonschema
        run: python -m unittest discover -s tests
      - name: Validate repository with jsonschema
        run: python tools/validate_repo.py
