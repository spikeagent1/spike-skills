name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      # `make validate` is the single gate: byte-compile, unit tests, the
      # validator, the citation check, and the generated index. CI names the
      # target rather than its commands so a gate added to the Makefile cannot
      # be one CI never runs. Both legs run the same target -- the validator
      # takes a different path with and without jsonschema, and both must pass.
      - name: Validate with stock Python
        run: make validate
      - name: Install optional schema validator
        run: python -m pip install --disable-pip-version-check jsonschema==4.26.0
      - name: Validate with jsonschema
        run: make validate
