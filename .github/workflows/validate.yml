name: Validate

on:
  pull_request:
  push:
    branches:
      - main
      - docs/life-domain-map

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python
        run: python -m py_compile tools/validate_repo.py tests/test_validate_repo.py
      - name: Run unit tests
        run: python -m unittest discover -s tests
      - name: Validate repository
        run: python tools/validate_repo.py
