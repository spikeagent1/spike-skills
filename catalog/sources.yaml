    publisher: weird-aftertaste
    version: 1.2.0
    artifact_sha256: 4fc44a5f45ae6820c08adc0a7aa4276aaa640e4eee3bd667059bceead772021e
    skill_file_sha256: c2f51919e7a65e36fb47a18dc09c451f59e046121c51e6bbcc002abfa9167b04
    license: MIT-0
    license_source: >-
      Checked https://clawhub.ai/weird-aftertaste/skills/literature-review on
      2026-08-28 (HTTP 200, 10s timeout curl -sL): the page's sidebar License
      field reads MIT-0, matching this entry.
    local_modifications: >-
      Adapted imported literature-review package to this repository's public
      portable contract: removed claims of comprehensive top-N searching and
      complete abstracts, made source failures and evidence level explicit,
      required reproducible search logs and appraisal, added safety/privacy
      sections, synthetic evals, and attribution limits. Also removed
      skill-card.md (unused by the repository contract) and relocated its
      install provenance artifacts (_meta.json, origin.json) from in-skill
      files to catalog/provenance/literature-review/.

