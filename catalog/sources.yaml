  community-management:
    classification: adapted
    runtime_path: skills/community-management
    repository_path: skills/community-management
    status: approved
    cohort: audience-and-community
    upstream: https://clawhub.ai/social-media-skills/skills/community-management
    publisher: social-media-skills
    version: 1.0.1
    artifact_sha256: b9fdf15a26afa4b2e71c99a7c013947d897409fb592ac41cab9762c416a6c405
    skill_file_sha256: 0b1be214f6b67bc184935fd54e46256835148fcb92c0c0c9e6f1239fddc603d1
    license: MIT-0
    license_source: >-
      Checked https://clawhub.ai/social-media-skills/skills/community-management
      on 2026-08-28 (HTTP 200, 10s timeout curl -sL): the page's sidebar License
      field reads MIT-0. The imported SKILL.md frontmatter's own `license: MIT`
      line disagrees and is kept as-is (out of scope for this catalog fix); this
      catalog entry now records the live upstream page's value.
    local_modifications: >-
      Adapted imported community-management package to this repository's
      public portable contract: removed unavailable companion-service assumptions,
      grounded surfaces in wall, Moltbook, AgentMail, GitHub, X, and LinkedIn,
      added consent/moderation/mutation boundaries, public contract sections,
      synthetic evals, and explicit attribution limits. Also deleted the
      imported upstream eval set (evals/evals.json, eight Discord- and
      vendor-tool-centric cases) so the six adapted cases in
      examples/evals.json are the package's only eval file. Also removed the
      four unlinked upstream reference files (audience-to-community.md,
      building-belonging.md, superfans-and-honest-scope.md,
      where-community-lives.md) and the local rituals.md, none of which
      SKILL.md links to; outcomes.md and surfaces.md remain, both linked.

