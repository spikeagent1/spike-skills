cohorts:
  - name: audience-and-community
    status: completed
    rationale: >-
      Owner-observed traction failure and repeated corrections showed that current
      workflows optimize activity constraints rather than audience outcomes.
    skills:
      - skill-library-ops
      - social-listening-engagement-loop
      - social-agent-practice
      - audience-content-engine
      - community-management
    acceptance:
      - no numerical or implicit engagement quota
      - direct replies handled before feed discovery
      - every qualified opportunity handled until exhaustion, rate limit, or session end
      - duplicate, spam, privacy, authority, and verification guards preserved
      - follower, reply, repeat-relationship, referral, and karma outcomes measured
      - platform-native behavior without fabricated algorithm claims

  - name: safety-and-mutation
    status: completed
    skills:
      - publish
      - cron-scheduler
      - conversation-archive

  - name: owner-operations
    status: completed
    skills:
      - daily-task-manager
      - briefing
      - owner-dream-cycle

  - name: research-and-writing
    status: completed
    skills:
      - literature-review
      - fact-check
      - draft-in-voice

  - name: portfolio-governance
    status: completed
    skills:
      - team-skill-sharing-norm
      - public-post-workshop

  - name: onboarding
    status: completed
    rationale: >-
      Repeated setup and handoff failures showed that onboarding must verify real
      runtime state, preserve privacy boundaries, and end with a usable handoff.
    skills:
      - owner-context-onboarding
      - mcp-connector-onboarding
      - runtime-handoff-onboarding
      - social-agent-onboarding
    acceptance:
      - collect only the context needed for the intended role
      - distinguish configured, authorized, reachable, and verified states
      - never expose credentials, private transcripts, or owner-only context
      - produce an explicit completion state and remaining blockers
      - include synthetic regression cases suitable for reuse

  - name: routing-overlap-and-long-tail
    status: queued
    skills: []

  - name: health-and-home-lifestyle
    status: completed
    rationale: >-
      The life-domain roadmap prioritizes everyday health and household utility
      after the first audience/community releases. This cohort contains
      reviewed packages now explicitly approved and applied through Skill Workshop;
      repository and runtime release state are reconciled.
    skills:
      - fitness-coach
      - meal-planner
      - sleep-review
      - health-appointment-prep
      - medication-and-symptom-log
      - home-cook
      - grocery-planner
      - household-maintenance
      - purchase-research
      - wardrobe-and-packing
    acceptance:
      - health skills prepare, plan, and summarize without diagnosing or treating
      - urgent health and household safety red flags escalate instead of producing unsafe instructions
      - current prices, inventory, weather, recalls, specs, and medical claims require current sources or uncertainty
      - every skill declares dependencies, provenance, privacy boundaries, and synthetic evals
      - repository validation passes before release
