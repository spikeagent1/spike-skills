cohorts:
  - name: audience-and-community
    status: completed
    rationale: >-
      Owner-observed traction failure and repeated corrections showed that current
      workflows optimize activity constraints rather than audience outcomes.
    skills:
      - skill-library-ops
      - social-listening-engagement-loop
      - social-agent-practice
      - audience-content-engine
      - community-management
    acceptance:
      - no numerical or implicit engagement quota
      - direct replies handled before feed discovery
      - every qualified opportunity handled until exhaustion, rate limit, or session end
      - duplicate, spam, privacy, authority, and verification guards preserved
      - follower, reply, repeat-relationship, referral, and karma outcomes measured
      - platform-native behavior without fabricated algorithm claims

  - name: safety-and-mutation
    status: completed
    skills:
      - publish
      - cron-scheduler
      - conversation-archive

  - name: owner-operations
    status: completed
    skills:
      - daily-task-manager
      - briefing
      - owner-dream-cycle

  - name: research-and-writing
    status: completed
    skills:
      - literature-review
      - fact-check
      - draft-in-voice

  - name: portfolio-governance
    status: completed
    skills:
      - team-skill-sharing-norm
      - public-post-workshop

  - name: onboarding
    status: completed
    rationale: >-
      Repeated setup and handoff failures showed that onboarding must verify real
      runtime state, preserve privacy boundaries, and end with a usable handoff.
    skills:
      - owner-context-onboarding
      - mcp-connector-onboarding
      - runtime-handoff-onboarding
      - social-agent-onboarding
    acceptance:
      - collect only the context needed for the intended role
      - distinguish configured, authorized, reachable, and verified states
      - never expose credentials, private transcripts, or owner-only context
      - produce an explicit completion state and remaining blockers
      - include synthetic regression cases suitable for reuse

  - name: launcher
    status: completed
    rationale: >-
      The routing baseline measured the native router answering many owner intents
      with no skill at all, and dropping specific phrasings even where the owning
      skill's description named them. A dispatcher that consults a rule table and
      the generated index is the architectural answer: it belongs to no life
      domain's cohort because it routes to all of them.
    skills:
      - home
    acceptance:
      - a precedence table carrying every intent the routing baseline measured as lost
      - the index read from disk at run time, never a remembered list of skills
      - exactly one skill routed with the intent restated, or exactly one question
      - no task performed and no answer improvised in the launcher's own turn
      - a routing fixture that fails when the launcher absorbs an unambiguous intent

  - name: routing-overlap-and-long-tail
    status: queued
    skills: []

  - name: autonomy
    status: completed
    rationale: >-
      The week-in audit found the approval ladder frozen in prose: no tool read it,
      no owner could relax it, and the record kind designed to carry a standing
      permission was written by nobody. A manager skill is the owner's surface onto
      that ring -- it writes the permissions, shows what stands, ends them, and
      counts the repeated approvals that argue for one. It belongs to no life
      domain's cohort because the permissions it keeps are about every domain.
    skills:
      - autonomy
    acceptance:
      - every contract previewed as an exact record and written only on the owner's authorization
      - creation refused outside an interactive owner turn, and on the skill's own initiative
      - a capability outside the eligible ring refused by name, never narrowed into a contract
      - no contract written for a write to the autonomy namespace itself
      - an ending supersedes and keeps the history readable
      - repeated approvals surfaced as a suggestion the owner may act on, never as a record

  - name: health-and-home-lifestyle
    status: completed
    rationale: >-
      The life-domain roadmap prioritizes everyday health and household utility
      after the first audience/community releases. This cohort contains
      reviewed packages now explicitly approved and applied through Skill Workshop;
      repository and runtime release state are reconciled.
    skills:
      - fitness-coach
      - meal-planner
      - sleep-review
      - health-appointment-prep
      - medication-and-symptom-log
      - home-cook
      - grocery-planner
      - household-maintenance
      - purchase-research
      - wardrobe-and-packing
    acceptance:
      - health skills prepare, plan, and summarize without diagnosing or treating
      - urgent health and household safety red flags escalate instead of producing unsafe instructions
      - current prices, inventory, weather, recalls, specs, and medical claims require current sources or uncertainty
      - every skill declares dependencies, provenance, privacy boundaries, and synthetic evals
      - repository validation passes before release
