# Reference shape for a new skill's catalog/approved.yaml and
# catalog/sources.yaml entries. Copy the relevant block(s) into the real
# catalog files; this file is not itself read by tooling.

# catalog/approved.yaml entry (every skill, owned or adapted):
- name: example-skill
  classification: owned                # owned | adapted | vendored | runtime-only
  runtime_path: skills/example-skill
  repository_path: skills/example-skill
  status: approved                     # approved | pending-review
  cohort: <cohort-name>                # must name a catalog/cohorts.yaml cohort that lists this skill
  workshop_proposal: example-skill-<yyyymmdd>-<10-char-id>
  contract_version: 1                  # 1 = today's sections; 2 = contracts/SKILL.template.md
  version: 1.0.0                       # owned: 1.0.0, bumped alongside contract_version;
                                        # adapted: must equal the sources.yaml entry's version

# catalog/sources.yaml entry, owned skill:
example-skill:
  classification: owned
  runtime_path: skills/example-skill
  repository_path: skills/example-skill
  status: approved
  cohort: <cohort-name>
  provenance: repo-owned
  version: 1.0.0                       # must equal the approved.yaml entry's version

# catalog/sources.yaml entry, adapted skill. The upstream install artifacts
# (`_meta.json`, `origin.json`) live under catalog/provenance/<skill>/, not
# in-skill; validate_repo.py checks their sha256/version fields against this
# entry's artifact_sha256, skill_file_sha256, and version:
example-adapted-skill:
  classification: adapted
  runtime_path: skills/example-adapted-skill
  repository_path: skills/example-adapted-skill
  status: approved
  cohort: <cohort-name>
  upstream: https://clawhub.ai/<publisher>/skills/<skill>
  publisher: <publisher>
  version: <upstream-version>          # must equal the approved.yaml entry's version
  artifact_sha256: <sha256>            # must equal catalog/provenance/<skill>/origin.json artifact.sha256
  skill_file_sha256: <sha256>          # must equal catalog/provenance/<skill>/origin.json skillFile.sha256
  license: <license>
  license_source: <exactly what page or file was checked, and when>
  local_modifications: >-
    <what changed from upstream, and why>

# validation:
#   Not a hand-authored catalog field. Pass rate, discriminating-assertion
#   counts, and staleness are populated from evals/baseline.json by
#   `python3 tools/run_evals.py baseline update` and read back with
#   `python3 tools/run_evals.py baseline check`.
