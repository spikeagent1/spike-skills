# The closed effect enum. A skill declares effects under
# metadata.spike-os.effects; the rules that govern them are contract M1-M8.
# derived_from: [design-derived] means no skill line carries the entry and it
# comes from the plan or docs/related-work.md instead.
version: 1

derivation:
  readOnlyHint: true when every declared effect is readOnlyHint
  destructiveHint: true when any declared effect is destructiveHint
  idempotentHint: true when every declared effect is idempotentHint
  openWorldHint: true when any declared effect is openWorldHint
  empty_effects: a skill with no declared effects is read-only, non-destructive, idempotent, closed-world
  approval_ladder: never_require < turn_scoped < preview_then_explicit < never_autonomous
  never_require: no gate beyond the skill being invoked
  turn_scoped: the owner naming the exact mutation this turn is sufficient, otherwise preview then explicit
  preview_then_explicit: always preview the exact mutation, then take explicit authorization
  never_autonomous: the owner authorizes in the moment; no standing authority, schedule, or handoff
  enforcement: declaration is lint and adapter policy, not a security boundary

promotion_gate:
  source_text: none
  summary: none
  belief: belief:update
  operating_instruction: identity:propose then identity:write
  permission: owner-only, never promotable by any skill

effects:
  - name: datastore:read
    readOnlyHint: true
    destructiveHint: false
    idempotentHint: true
    openWorldHint: false
    approval: never_require
    resource_class: classified
    derived_from: [skills/briefing/SKILL.md:21]
    summary: Read records from namespaces the skill declares in reads_from.
  - name: datastore:write
    readOnlyHint: false
    destructiveHint: false
    idempotentHint: true
    openWorldHint: false
    approval: turn_scoped
    resource_class: classified
    derived_from: [skills/owner-context-onboarding/SKILL.md:105, skills/daily-task-manager/SKILL.md:89]
    note: owner-context-onboarding:105 argues preview_then_explicit; turn_scoped chosen because daily-task-manager:89 authorizes the exact mutation the owner named this turn
    summary: Write or supersede a record in a declared namespace, with readback.
  - name: checkpoint:advance
    readOnlyHint: false
    destructiveHint: false
    idempotentHint: true
    openWorldHint: false
    approval: preview_then_explicit
    resource_class: classified
    derived_from: [skills/briefing/SKILL.md:12, skills/briefing/SKILL.md:93]
    summary: Move one cursor in checkpoints/ after terminal verification.
  - name: belief:update
    readOnlyHint: false
    destructiveHint: false
    idempotentHint: false
    openWorldHint: false
    approval: preview_then_explicit
    resource_class: classified
    derived_from: [skills/social-agent-practice/SKILL.md:47, skills/social-agent-practice/SKILL.md:64]
    summary: Change a durable belief through the requested-writing workflow only.
  - name: identity:propose
    readOnlyHint: true
    destructiveHint: false
    idempotentHint: true
    openWorldHint: false
    approval: never_require
    resource_class: classified
    derived_from: [skills/owner-dream-cycle/SKILL.md:46]
    summary: Record a proposed identity or authority change as a candidate only.
  - name: identity:write
    readOnlyHint: false
    destructiveHint: true
    idempotentHint: false
    openWorldHint: false
    approval: never_autonomous
    resource_class: classified
    derived_from: [skills/owner-dream-cycle/SKILL.md:14, skills/social-agent-practice/SKILL.md:49]
    summary: Apply an owner-confirmed change to identity files.
  - name: provider:read
    readOnlyHint: true
    destructiveHint: false
    idempotentHint: true
    openWorldHint: true
    approval: never_require
    resource_class: network
    derived_from: [skills/daily-task-manager/SKILL.md:22, skills/briefing/SKILL.md:37]
    summary: Read state from an authorized external provider.
  - name: provider:write
