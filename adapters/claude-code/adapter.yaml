# Runtime adapter: Claude Code on the owner's Mac. The datastore is the
# owner's vault; the gbrain MCP server, the local CLI, and plain Markdown
# are three ordered ways into it, and the fallbacks are first-class because the
# MCP server is not always up. Repo-side values only: every personal value is a
# ${PLACEHOLDER} the installer resolves from local_overrides_file. Shape:
# adapters/adapter.schema.json. A note beginning UNCONFIRMED marks a value this
# host cannot attest at all, and the installer refuses a skill that depends on
# it; a note beginning DEGRADED marks one known absent or partial whose skill
# contract already discloses the fallback, and the installer installs it with a
# printed note.
runtime: claude-code
version: 1

vocabulary:
  owner:
    value: ${OWNER_NAME}, described in ~/.claude/CLAUDE.md and the profile namespace
  agent:
    value: the Claude Code session, operating under ~/.claude/CLAUDE.md
  owner_datastore:
    value: the owner's vault at ${VAULT_ROOT}, indexed by _system/shared-context.pglite
    note: The Markdown files are canonical and the index is rebuilt from them, which is why the direct-Markdown fallback is safe.
  durable_memory:
    value: the same vault; ~/.claude/CLAUDE.md is its always-loaded summary
  task_provider:
    value: the Todoist MCP server when the connector registry lists one, otherwise mirror-only
    note: DEGRADED - claude mcp list names no Todoist server on this host. The absence is known, not unknown, and contracts/sync.md already states the fallback for it - system_of_record flips to datastore and the skill discloses that the object is mirror-only - so a task skill installs here and says so.
  calendar_provider:
    value: the Google Calendar MCP server
  mail_provider:
    value: the agentmail MCP server for the agent, the Gmail MCP server for the owner
    note: DEGRADED - claude mcp list shows no agentmail server on this host, so the agent half is absent; the owner half is present, Gmail and Google Calendar are both connected. A mail read is therefore the owner's mailbox only, which the reading skill discloses as a partial source rather than a missing one.
  contacts_provider:
    value: none configured
  owner_timezone:
    value: ${OWNER_TZ}
    note: The host zone is not authoritative; the owner sets it in the overrides file.
  scheduler:
    value: Claude Code /schedule routines, with launchd for host-local jobs
  notification_channel:
    value: an in-session reply, then the agent inbox, then a routine notification
    note: First channel that works wins; a held delivery waits for the next interactive session.
  owner_channel:
    value: the interactive Claude Code session
  public_surfaces:
    value: none unless ${PUBLIC_SURFACES} names one
    note: A skill declaring publish:external is blocked here until the overrides file names a surface.
  agents_public_journal:
    value: none in this runtime
  agent_community_network:
    value: none in this runtime
  agent_inbox:
    value: ${AGENT_INBOX}
    note: UNCONFIRMED - reached through the agentmail MCP server, which claude mcp list does not show on this host.
  durable_tool_paths:
    value: ~/.bun/bin, ~/.local/bin, and ${AGENT_BIN}
    note: UNCONFIRMED - ${AGENT_BIN} does not exist on this host; the first two do.
  credential_store:
    value: the macOS keychain, plus per-server env in ~/.claude.json
    note: Read a credential where it lives; never copy a value into a record, a log, or a reply.
  connector_registry:
    value: the union of claude mcp list (account-level connectors) and the mcpServers blocks of ~/.claude.json (top-level and per-project)
    note: Neither half is the whole registry. On this host ~/.claude.json holds gbrain and railway, while Gmail and Google Calendar are account-level and appear only in claude mcp list.
  runtime_health_check:
    value: mcp__gbrain__get_health, or claude mcp list for the registry as a whole
    note: Both attested on this host - get_health is in gbrain --tools-json, and claude mcp list runs. Neither could be round-tripped live because the configured server binary ~/.bun/bin/gbrain is missing.
  runtime_reload:
    value: restart the session, or reconnect one server with /mcp
  identity_files:
    value: ~/.claude/CLAUDE.md and the profile pages under ${VAULT_ROOT}/profile/
    note: ~/.claude is a git repo; the installer prints the commit command and does not run it.
  skills_dir:
    value: ~/.claude/skills
    note: About a hundred unrelated skills already live here; install only into directories carrying a spike-os stamp.
  activity_log:
    value: ${VAULT_ROOT}/ops/activity/
    note: The vault has no ops/ tree yet; the installer creates it.
  checkpoint_store:
    value: ${VAULT_ROOT}/ops/checkpoints/
  autonomy_contract:
    value: ${VAULT_ROOT}/autonomy/
    note: An owner-written root namespace like decisions/; empty until the owner writes one.
  capabilities:
    value: metadata.spike-os.capabilities on the installed skill, plus the disable-model-invocation flag a never_autonomous tier renders
    note: Declaration is lint and launcher policy on this runtime, never a sandbox.
  repo_identity:
    value: ${REPO_IDENTITY}, through the gh CLI
  proposal_workflow:
    value: pull-request review on the repository in hand
  journal_build_toolchain:
    value: none in this runtime
  entry_schema:
    value: none in this runtime
  journal_source_branch:
    value: none in this runtime
  norms_directory:
    value: .agents/behaviors/<name>/BEHAVIOR.md, relative to the repo in hand
    note: UNCONFIRMED - no such directory exists yet; this is the agreed convention, shared with the openclaw adapter.

datastore:
  paths:
    profile: profile/
    people: people/
    agents: agents/
    projects: projects/<name>/
    decisions: decisions/
    autonomy: autonomy/
    journal: ops/journal/
    conversations: ${CONVERSATIONS_ROOT}
    tasks: ops/tasks/
    calendar: ops/calendar/
    inbox: ops/inbox/
    jobs: ops/jobs/
    activity: ops/activity/
    checkpoints: ops/checkpoints/
    notifications: ops/notifications/
  verbs:
    read: mcp__gbrain__get_page slug=<namespace>/<id>
    search: mcp__gbrain__search query=<query>
    list: mcp__gbrain__list_pages type=<namespace>
    timeline: mcp__gbrain__get_timeline slug=<namespace>/<id>
    write: mcp__gbrain__put_page slug=<namespace>/<id> content=<full Markdown with frontmatter>
    append_timeline: mcp__gbrain__add_timeline_entry slug=<namespace>/<id> date=<local date> summary=<one line> detail=<optional>
    supersede: put the replacement page, then put the original with status superseded
  field_map:
    namespace: type
    visibility: sensitivity
    status.active: confirmed
    provenance.source_ids: source_ids
    id: the page slug, which is the filename without .md
    kind: no vault equivalent; written through as frontmatter
  note: Paths are relative to ${VAULT_ROOT} except conversations, a separate root defaulting to the ${CONVERSATIONS_ROOT} the overrides file names. Only profile/, people/, projects/, and decisions/ exist in the vault today; agents/, every ops/ path, and ${CONVERSATIONS_ROOT} are chosen layouts the installer creates on first write, not directories already there. The vault's own inbox/ is a different thing - user-approved source captures, cited from index.md - so the inbox namespace deliberately maps to ops/inbox/ and never to it. Fallback order for every verb is the gbrain MCP server, then ${VAULT_ROOT}/bin/gbrain-local with the same subcommands, then reading or writing the Markdown file directly. The MCP tool names above are attested by gbrain --tools-json on this host, which enumerates all 41 tools including get_timeline and get_health; the configured server binary ~/.bun/bin/gbrain is missing, so no live round-trip confirmed them. Embeddings are off, so search is keyword-only; prefer exact slugs.

notification:
  channels:
    - an in-session reply
    - the agent inbox
    - a routine notification
  quiet_hours:
    start: ${QUIET_START}
    end: ${QUIET_END}
    timezone_term: owner_timezone

scheduler: Claude Code /schedule routines, with launchd for host-local jobs

identity_files:
  - ~/.claude/CLAUDE.md
  - ${VAULT_ROOT}/profile/

skills_dir: ~/.claude/skills

adapter_file: ${HOME}/.claude/spike-os/ADAPTER.md

identity_import:
  file: ${HOME}/.claude/CLAUDE.md
  line: "@~/.claude/spike-os/ADAPTER.md"
  begin_marker: <!-- spike-os:begin -->
  end_marker: <!-- spike-os:end -->

render:
  when_to_use: true
  # destructiveHint only. openWorldHint marks a skill that reaches outside the
  # runtime -- a web read, a provider, a mailbox -- and most of the library
  # carries it; disabling model invocation on it took those skills off the
  # router's ballot, so the routing baselines would have described a library the
  # model cannot reach. An irreversible effect is the one case worth costing a
  # deliberate invocation.
  disable_model_invocation_on_approval: [never_autonomous]
  user_invocable_default: true
  background_skills: []
  metadata_extra:
    paths: file globs from the Inputs Dependencies line, when the skill is file-scoped

local_overrides_file: ${HOME}/.config/spike-os/claude-code.local.yaml
